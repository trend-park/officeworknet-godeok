name: deploy
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "build.py (gzip+base64)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore build.py
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: printf '%s' "$PAYLOAD" | tr -d ' \n' | base64 -d | gunzip > build.py
      - name: Build site
        run: python3 build.py
      - name: Commit
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "site update"
          git push
